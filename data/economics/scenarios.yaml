# CONTRACT 4 (v2) — Economic scenario config
# ===========================================================================
# The EconomicModel (Track E) reads THIS file to turn a prediction surface
# into a minable-footprint raster, per scenario. Track E ships the MECHANISM;
# every NUMBER below is a labeled placeholder that Track G replaces.
#
#   *** ALL VALUES ARE ILLUSTRATIVE PLACEHOLDERS ***
#   Every scenario carries `illustrative_only: true`. While that flag is true,
#   the engine stamps an "ILLUSTRATIVE ONLY" watermark on every economic map
#   and refuses to present the output as a real result. [GEOLOGY — ISAAC]
#   sets real values and flips the flag to false at integration checkpoint 4.
#
# v2 note: STRUCTURE UNCHANGED from v1. The only difference is that placeholder
# cutoffs are now anchored to TS-6's REAL abundance distribution for realism:
#   TS-6 CCZ abundance: mean ~5-7 kg/m2, median ~5.5, max ~24-44 kg/m2;
#   block means ISA-1..4 ~4.8-6.3 kg/m2 (still placeholders — Isaac sets real).
#
# minability rule (same for every scenario, parameters differ):
#   1. estimate per-cell resource from the prediction surface (value column)
#   2. convert to a per-cell metric via `grade_metric` (abundance or $-value)
#   3. cell is MINABLE if metric >= cutoff_value AND cell not in an exclusion
#      AND cell passes every rule in `spatial_filters`
# ===========================================================================

config_version: 2

# How the per-cell "grade" the cutoff is compared against is computed.
# [GEOLOGY — ISAAC] Choose ONE and delete the other, or keep both if you want
# the engine to support switching. "abundance" uses the predicted kg/m2
# directly. "dollar_value" combines metal grades x prices (see metal_weights).
grade_metric: abundance            # abundance | dollar_value
grade_units: kg_m2                 # must match the sample `unit` when abundance

# Metal composition, used only when grade_metric = dollar_value. weight_fraction
# = fraction of dry nodule mass; price_usd_per_tonne = market.
# [GEOLOGY — ISAAC] Replace with real composition + a price source. TS-6 baseline
# grades (dry wt): Mn ~28-29%, Ni ~1.3%, Cu ~1.1%, Co ~0.22% — good starting point.
metal_weights:                     # <<< ILLUSTRATIVE PLACEHOLDERS (TS-6-anchored) >>>
  manganese: { weight_fraction: 0.285, price_usd_per_tonne: 0 }
  nickel:    { weight_fraction: 0.013, price_usd_per_tonne: 0 }
  copper:    { weight_fraction: 0.011, price_usd_per_tonne: 0 }
  cobalt:    { weight_fraction: 0.0022, price_usd_per_tonne: 0 }

# Spatial filters applied on top of the grade cutoff (physical minability).
# [GEOLOGY — ISAAC] Confirm real thresholds (e.g., collector slope limits).
spatial_filters:                   # <<< ILLUSTRATIVE PLACEHOLDERS >>>
  max_slope_degrees: 6             # cells steeper than this are not collectable
  apply_exclusions: true           # subtract data/aoi/exclusions.geojson

scenarios:

  - scenario_name: MARKET_STANDARD
    description: >
      Only ground that clears a conventional commercial cutoff at current
      metal prices. Represents "what the market would mine."
    illustrative_only: true        # [GEOLOGY — ISAAC] -> false when real
    cutoff_value: 10.0             # <<< PLACEHOLDER >>> kg/m2; ~upper-half of TS-6 range
    cost_model:                    # <<< PLACEHOLDERS >>>
      recovery_cost_usd_per_m2: 0
      cost_varies_with_depth: false
    caveats:
      - "[GEOLOGY — ISAAC] Replace the cutoff with a defensible commercial value or range."
      - "Metal prices are a recorded snapshot; results shift as prices move."
      - "TS-6 abundance is likely UNDERestimated (grab-sampler bias); a fixed cutoff inherits that bias."

  - scenario_name: STRATEGIC_SUBSIDIZED
    description: >
      A lower effective cutoff justified by critical-minerals supply security
      rather than profit — i.e., ground a government might subsidize into
      production. The DIFFERENCE from MARKET_STANDARD is the headline output.
    illustrative_only: true        # [GEOLOGY — ISAAC] -> false when real
    cutoff_value: 5.5              # <<< PLACEHOLDER >>> ~TS-6 median; deliberately below market
    cost_model:                    # <<< PLACEHOLDERS >>>
      recovery_cost_usd_per_m2: 0
      cost_varies_with_depth: false
      subsidy_note: "strategic value, not profit, motivates this cutoff"
    caveats:
      - "[GEOLOGY — ISAAC] Replace with a defensible strategic cutoff or range."
      - "Strategic value is a policy judgment, not a lookup; present as a scenario, never a recommendation."
      - "Environmental and social costs of low-yield extraction are NOT priced here."

# The engine also emits difference(MARKET_STANDARD, STRATEGIC_SUBSIDIZED):
# the 'strategic-only' footprint = minable under strategic but not under market.
difference_pairs:
  - [MARKET_STANDARD, STRATEGIC_SUBSIDIZED]
