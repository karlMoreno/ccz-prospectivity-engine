    #   UNRESOLVED is distinct from INAPPLICABLE (no mass exists) and from OPEN
    #   (a mass exists, basis unstated): for P4 we do not know whether the values
    #   are masses at all. Do NOT fill abundance_basis for P4 -- "unknown"
