    evidence_classes: [MASS, COUNT, COVER]
    primary_use: TRAIN                        # MASS rows train the model
    is_open: true
    license: "CC-BY-NC-4.0"
    sampled_area_m2: 0.25                     # → kg/m2 = total nodule mass / 0.25 (×4)
    derivation: "abundance_kg_m2 = nodule_mass_kg / sampled_area_m2"
    accessed_date: null                       # [GEOLOGY — ISAAC] fill on download
    # Filled P2.0d-2 (2026-08-09): recomputed from the downloaded file's bytes
    # and verified against manifest.json's input_content_hash. This is the
    # RECORDED evidence the production guard re-hashes against — MEASURED's
    # proof, per the contract's own fill-on-download lifecycle.
    content_hash: "sha256:36078e69a22f0413ace0bc7704a076fc4e179bf5416f9ff55a08806a7a1138f0"
    notes: "First modern contractor-area table. Keep event_id; COVER column stays COVER (not converted)."

