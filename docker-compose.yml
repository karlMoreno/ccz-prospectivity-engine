# Phase 0 (E0.1): scaffolds local Postgres/PostGIS + MinIO so later phases
# (provenance metadata, corpus/raster storage) have somewhere to land. Nothing
# in the Phase 0 code connects to these yet — they are infrastructure only.
services:
  # E5.7: the deployable — the read-only API serving the pinned run in deploy/run/
  # and the static viewer, one process (see ../Dockerfile and deploy/README.md).
  # `docker compose up viewer`, then http://localhost:8000/ and
  # `python deploy/verify_deployment.py http://localhost:8000`.
  viewer:
    build:
      context: .
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
    ports:
      - "8000:8000"

  # Phase 0 (E0.1) infrastructure, still unconnected (BACKLOG §6: Postgres/PostGIS
  # parked); not needed by the viewer service above.
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ccz_prospectivity
      POSTGRES_USER: ccz
      POSTGRES_PASSWORD: ccz_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ccz
      MINIO_ROOT_PASSWORD: ccz_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
