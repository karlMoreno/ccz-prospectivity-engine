# CONTRACT 3 (v2) — Covariate registry
# ---------------------------------------------------------------------------
# The single source of truth for which covariates the engine uses, and with
# what parameters. Track E implements each ENABLED recipe deterministically
# and records its recipe_version in the provenance manifest. Track G requests
# additions/parameter changes by editing this file (additive changes are
# non-breaking).
#
# Rule: a covariate is reproducible => every recipe has a version, and any
# change to a recipe's math or parameters REQUIRES bumping recipe_version.
# Structure frozen in Phase 0; the *list* may grow.
#
# v2 CHANGE (structure unchanged): the disabled `candidate_covariates` list
# was SWAPPED from vague guesses to the FOUR proxies ISA Technical Study No. 6
# actually found predictive. Still disabled = "Option B" (build after the
# Option-A terrain-only pipeline is validated end-to-end). The ENABLED
# Option-A terrain list is UNCHANGED. registry_version bumped 1 -> 2.
#
# v3 CHANGE (E1.4 Preflight 2, 2026-07-28; approved by the engineer of
# record): neighborhood parameters are now PHYSICAL DISTANCES IN METRES, not
# cell counts. Cells are not a unit of distance: the same `window_cells: 3`
# meant a ~33 km neighborhood on the 0.1-degree synthetic DEM but ~1.4 km on
# real 15-arc-sec GEBCO — a 24x change in what the feature physically
# measures, with no recipe_version bump and nothing that could detect it at
# Checkpoint 1. Windowed recipes (roughness, tpi, bpi) now declare metres;
# the engine resolves metres -> cells at runtime from the DEM's actual N-S
# cell size (square windows: nearest odd cell count, ties round up, minimum
# 3; radii: round half up, minimum 1, outer forced > inner). BOTH the
# requested metres and the resolved cell window are recorded in each layer's
# provenance. On a DEM too coarse for the requested distance the resolution
# clamps to the minimum and records `clamped: true` — by design, not an
# error (the coarse synthetic DEM does this; real GEBCO does not).
# The metre values below preserve what v2's cell counts meant on real GEBCO
# 15-arc-sec (~460 m/cell at 13N): 3 cells ~ 1400 m span; BPI inner 1 cell
# ~ 460 m, outer 5 cells ~ 2300 m.
#
# NATIVE-RESOLUTION OPERATORS: slope, aspect, and both curvatures are defined
# on the immediate 3x3 stencil at the DEM's native resolution — that is the
# operator's definition, not a tunable window, so they carry no metre
# parameter and their physical scale IS the DEM resolution. Consequence:
# covariates computed from DEMs of different resolutions must NEVER be mixed
# in one training matrix. The provenance manifest records the DEM resolution,
# so this is checkable.
#
# recipe_version bumped 1 -> 2 for roughness, tpi, bpi (parameter semantics
# changed: cells -> metres). registry_version bumped 2 -> 3.
#
# registry_version 3 -> 4 (P2.0c, 2026-08-08): METADATA-ONLY. Added origin
# markers (engine/prospectivity/provenance/origin.py): file-level
# `data_origin`/`author`, per-entry `data_origin` (enabled Option-A entries
# are AUTHORED — window/radius defaults are engineering stand-ins preserving
# v2's cell counts, and the physically meaningful scale is still the open
# [GEOLOGY — ISAAC] question above; candidate entries are LITERATURE, with
# their citation gap recorded rather than guessed). No recipe, parameter
# value, or enabled flag changed; re-sync is a read, not a review.

registry_version: 4

# P2.0c origin declaration for the FILE remainder (default_window_m and other
# top-level scalars). Effective file origin is COMPUTED by combine_origins
# over this plus the per-entry declarations below.
data_origin: AUTHORED
author: unrecorded

# Neighborhood window used by window-based recipes, as a PHYSICAL DISTANCE in
# metres (full window span for square windows), converted to a cell window at
# runtime from the DEM's actual resolution. 1400 m preserves what the old
# 3-cell default meant on real GEBCO 15-arc-sec.
# [GEOLOGY — ISAAC] Advise the physically meaningful scale(s) for nodule
# formation — in metres/km now, not cells; multiple windows can be added as
# separate covariates if useful.
default_window_m: 1400

# ---------------------------------------------------------------------------
# OPTION A — terrain-derived covariates (ENABLED). Built in the alpha from the
# bathymetry DEM alone; fully reproducible, no extra data/licensing. UNCHANGED
# from v1.
# ---------------------------------------------------------------------------
covariates:

  - name: depth
    recipe: passthrough           # the DEM value itself
    recipe_version: 1
    enabled: true
    params: {}
    data_origin: AUTHORED
    author: unrecorded
    geology_note: "[GEOLOGY — ISAAC] TS-6 found highest abundance at 4,100-4,200 m; is absolute depth or relative relief the better signal?"

  - name: slope
    recipe: horn_slope            # Horn (1981) 3x3 gradient
    recipe_version: 1
    enabled: true
    params: { units: degrees }
    data_origin: AUTHORED
    author: unrecorded

  - name: aspect
    recipe: horn_aspect
    recipe_version: 1
    enabled: true
    params: { units: degrees, undefined_flat_as: -1 }
    data_origin: AUTHORED
    author: unrecorded

  - name: roughness
    recipe: std_dev_elevation     # stdev of elevation in the window
    recipe_version: 2             # v3: window now in metres, resolved at runtime
    enabled: true
    params: { window_m: 1400 }
    data_origin: AUTHORED         # 1400 m preserves v2's 3-cell default; geology scale still open
    author: unrecorded

  - name: profile_curvature
    recipe: zevenbergen_thorne_profile
    recipe_version: 1
    enabled: true
    params: {}
    data_origin: AUTHORED
    author: unrecorded

  - name: plan_curvature
    recipe: zevenbergen_thorne_plan
    recipe_version: 1
    enabled: true
    params: {}
    data_origin: AUTHORED
    author: unrecorded

  - name: tpi
    recipe: topographic_position_index   # cell minus mean(window)
    recipe_version: 2             # v3: window now in metres, resolved at runtime
    enabled: true
    params: { window_m: 1400 }
    data_origin: AUTHORED         # 1400 m preserves v2's 3-cell default; geology scale still open
    author: unrecorded

  - name: bpi
    recipe: bathymetric_position_index   # TPI with an annulus (inner/outer)
    recipe_version: 2             # v3: radii now in metres, resolved at runtime
    enabled: true
    params: { inner_radius_m: 460, outer_radius_m: 2300 }
    data_origin: AUTHORED         # radii preserve v2's 1/5-cell defaults; geology scale still open
    author: unrecorded

# ---------------------------------------------------------------------------
# OPTION B — TS-6-PROVEN proxies (DISABLED until Track G sources each layer).
# These are the covariates ISA Technical Study No. 6 reported as the strongest
# predictors. They are NOT terrain-derived (except bathymetric_regime, which is
# classified FROM the DEM) — each needs its own raster + a Contract 5 entry
# (is_open=true). Enable in Phase 6 to move toward TS-6 parity.
# [GEOLOGY — ISAAC] source each layer, set source_id, confirm units/classes.
# ---------------------------------------------------------------------------
candidate_covariates:

  - name: sediment_type
    recipe: external_raster
    recipe_version: 0
    enabled: false
    params:
      source_id: null
      classes: [siliceous, pelagic_clay, calcareous]
    ts6_finding: "STRONGEST correlate of nodule OCCURRENCE (WofE + Logistic Regression). Siliceous = favorable, calcareous = unfavorable."
    data_origin: LITERATURE       # the entry's substance is the TS-6 finding
    citation: "ISA Technical Study No. 6 (2010) — specific table/page NOT LOCATED; evidence gap carried, not guessed (BACKLOG)"

  - name: surface_chlorophyll
    recipe: external_raster
    recipe_version: 0
    enabled: false
    params:
      source_id: null
      unit: mg_m3
    ts6_finding: "BEST single predictor of metal content; ~0.49 R2 (Mn), 0.44 (Ni), 0.39 (Cu) alone. Non-linear (intermediate productivity optimal)."
    data_origin: LITERATURE       # the entry's substance is the TS-6 finding
    citation: "ISA Technical Study No. 6 (2010) — specific table/page NOT LOCATED; evidence gap carried, not guessed (BACKLOG)"

  - name: ccd_minus_depth
    recipe: external_raster
    recipe_version: 0
    enabled: false
    params:
      source_id: null
      unit: m
    ts6_finding: "Improves Cu regression (0.39 -> 0.49). Below-CCD = favorable for nodules."
    data_origin: LITERATURE       # the entry's substance is the TS-6 finding
    citation: "ISA Technical Study No. 6 (2010) — specific table/page NOT LOCATED; evidence gap carried, not guessed (BACKLOG)"

  - name: bathymetric_regime
    recipe: classify_from_dem            # derived FROM the DEM, so no external source needed
    recipe_version: 0
    enabled: false
    params:
      regimes: [oceanic_rise, seamount_chain, abyssal_hills, seamount_abyssal, fracture_zone]
    ts6_finding: "2nd/3rd strongest OCCURRENCE correlate. Favorability: abyssal_hills > seamount_abyssal > (rise = seamount_chain = fracture_zone)."
    data_origin: LITERATURE       # the entry's substance is the TS-6 finding
    citation: "ISA Technical Study No. 6 (2010) — specific table/page NOT LOCATED; evidence gap carried, not guessed (BACKLOG)"
