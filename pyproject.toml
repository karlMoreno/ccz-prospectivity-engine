[project]
name = "ccz-prospectivity-engine"
version = "0.1.0"
description = "Open, reproducible modernization of ISA Technical Study No. 6 for one CCZ study area."
# <3.12: the known-good binary-wheel set (rasterio 1.4.1, netcdf4 1.6.5 for
# the [fetch] extra) is resolved and locked for cp311 (requirements.lock);
# other minors are unverified on macOS arm64.
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
readme = "README.md"

# Approved stack only (CLAUDE.md "Dependency & scope discipline"). Phase 0
# pinned only what the scaffold imported; Phase 1 (E1.1, real SourceAdapters)
# adds openpyxl (Dryad/Mendeley xlsx). pangaeapy moved to the [fetch] extra
# (2026-07-29): its netcdf4>1.6.5 requirement has no cp311/macOS-arm64 wheel
# (source build needs HDF5 headers), and its ONLY import site is the lazy
# _fetch_via_pangaeapy in pangaea_adapter.py — production reads local .tab
# files from data/sources/ via injected dataset_loaders and never calls it.
# scikit-gstat/pykrige/richdem/xarray-spatial/fastapi are still approved
# but land with the phases that first use them. scikit-learn landed with
# E2.3 (random forest) — the first phase to use it. quantile-forest (Zillow,
# Apache-2.0) was a deliberate E2.3 decision (Karl, 2026-08-14; the
# measured case is docs/walkthroughs/E2.3.md §1): its uncertainty is the
# conditional distribution, comparable to the baseline's SD and kriging's
# variance, where ensemble spread understates by 2-4x on rank-4 X.
dependencies = [
    "pydantic>=2.6,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "rasterio>=1.3,<2",
    "shapely>=2.0,<3",
    "pyyaml>=6.0,<7",
    "openpyxl>=3.1,<4",
    "scikit-learn>=1.5,<2",
    "quantile-forest>=1.4,<2",
    # E5.1 (2026-08-22): the read-only API. fastapi (MIT) + uvicorn (BSD-3-Clause)
    # were approved in CLAUDE.md since Phase 0 and never installed — "the pinned
    # FastAPI" did not exist until this line (E5.0 §2). Transitive additions,
    # measured at install: starlette (BSD-3), anyio (MIT), h11 (MIT), idna
    # (BSD-3), annotated-doc (MIT) — seven packages with uvicorn; httpx2 +
    # httpcore2 + truststore (all BSD-3) are the [dev] extra's, for the TestClient.
    # A library is a TOOL, not a value: the origin taxonomy does not classify
    # it (the quantile-forest precedent above, E2.3, Karl 2026-08-14).
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    # E1.4 plot deliverable only — never imported by engine runtime code
    # (sole import site: engine/prospectivity/features/plot_stack.py).
    "matplotlib>=3.8,<4",
    # E5.1: Starlette 1.6's TestClient wants httpx2 (BSD-3-Clause; + httpcore2,
    # truststore) — it DEPRECATES httpx ("install httpx2 instead"), measured as
    # a StarletteDeprecationWarning on the first test run. Test-only.
    "httpx2>=2.12,<3",
]
# Live PANGAEA DOI fetching only (never exercised by the pipeline or tests).
# On macOS arm64/cp311 this needs HDF5 first (`brew install hdf5 netcdf`)
# because pangaeapy pulls netcdf4>1.6.5, which has no binary wheel there.
fetch = ["pangaeapy>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["engine*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
